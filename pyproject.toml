[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "parkrep"
version = "0.1.0"
description = "Turn a phone video of your outdoor workout into an Evangelion-style rep analysis, fully offline."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "Pillow>=11",
    "opencv-python-headless>=4.10",
    "torch>=2.4",
    "einops>=0.8",
]

[project.scripts]
parkrep = "parkrep.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["parkrep*"]
